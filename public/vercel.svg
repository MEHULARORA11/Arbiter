<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep premium dark space background -->
    <radialGradient id="arbiterBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Authoritative Gold / Cyber Amber gradient for the Arbiter core -->
    <linearGradient id="arbiterCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="40%" stop-color="#ffae00" />
      <stop offset="100%" stop-color="#ffee55" />
    </linearGradient>

    <!-- Sleek High-tech Cyan/Steel secondary accent -->
    <linearGradient id="cyberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Precise neon aura glow -->
    <filter id="judgmentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sharp, modern rounded squircle background container -->
  <rect width="512" height="512" rx="140" fill="url(#arbiterBg)" />

  <!-- Outer Precision Reticle Lines -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#cyberAccent)" stroke-width="2" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#arbiterCore)" stroke-dasharray="12 8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- The Arbiter Monogram & Scale Chevron Structure -->
  <g filter="url(#judgmentGlow)">
    <!-- Main Left Pillar of the 'A' -->
    <path d="M225 90 L 95 380 C 90 392, 98 405, 112 405 L 165 405 C 175 405, 183 398, 187 390 L 256 230 L 285 295 L 315 230 L 256 95 C 250 82, 232 82, 225 90 Z" fill="url(#arbiterCore)" />
    
    <!-- Main Right Pillar of the 'A' -->
    <path d="M287 90 L 417 380 C 422 392, 414 405, 400 405 L 347 405 C 337 405, 329 398, 325 390 L 256 230 L 227 295 L 256 360 L 305 360 L 325 405 L 380 405 Z" fill="url(#arbiterCore)" opacity="0.85" />
    
    <!-- Sharp Cross-beam / The "Decision Prism" (Representing the balancing scale beam) -->
    <polygon points="145,310 367,310 335,340 177,340" fill="url(#cyberAccent)" />
    
    <!-- The Floating Verdict Core (The central floating nexus point) -->
    <polygon points="256,140 285,200 256,220 227,200" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Geometric Tech Accents -->
  <rect x="252" y="30" width="8" height="30" rx="4" fill="#00f2fe" opacity="0.4" />
  <rect x="252" y="452" width="8" height="30" rx="4" fill="#ffae00" opacity="0.4" />
</svg>
